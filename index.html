<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Game Field Guide</title>
<meta name="description" content="Learn popular board games from one illustrated page each, and find games like the ones you know.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
<main class="wrap">

  <section class="intro" id="games">
    <h1>Learn any board game from one page.</h1>
    <p>Pick a game. Not sure what to play? <a href="map.html">Find games like ones you already know →</a> or <a href="deepdive.html">get your gamer profile →</a></p>
  </section>
  <div class="filters">
    <input type="search" id="q" placeholder="Search games or mechanics…" aria-label="Search">
    <select id="np" aria-label="Number of players"><option value="">Any player count</option></select>
    <select id="tm" aria-label="Play time"><option value="">Any length</option><option value="30">Up to 30 min</option><option value="60">Up to 60 min</option><option value="120">Up to 2 hours</option></select>
    <select id="sort" aria-label="Sort"><option value="family">Group by family</option><option value="light">Lightest rules first</option><option value="name">A–Z</option></select>
  </div>
  <div class="filters" id="fams"></div>
  <div id="gallery"></div>
</main>

<script src="js/site.js"></script>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/sheet.js"></script>
<script>
const ICON_P = '<svg viewBox="0 0 24 24" class="ico"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.5 2.7-6 6-6s6 2.5 6 6z"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 13.3c3 .1 5.5 2.4 5.5 5.7h-4.4"/></svg>';
const ICON_T = '<svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5.5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const rng = r => r[0] === r[1] ? r[0] : r[0] + '–' + r[1];

loadGames().then(games => {
  const np = document.getElementById('np');
  for (let n = 1; n <= 10; n++) np.insertAdjacentHTML('beforeend', `<option value="${n}">${n} player${n > 1 ? 's' : ''}</option>`);

  const activeFams = new Set();
  const famBox = document.getElementById('fams');
  famBox.innerHTML = Object.entries(FAMILIES).map(([k, f]) => `<button class="fpill" data-f="${k}" style="--fam:${f.color}"><i></i>${f.label}</button>`).join('');
  famBox.querySelectorAll('button').forEach(b => b.onclick = () => {
    activeFams.has(b.dataset.f) ? activeFams.delete(b.dataset.f) : activeFams.add(b.dataset.f);
    b.classList.toggle('on'); render();
  });

  const card = g => {
    const f = FAMILIES[g.family];
    return `<a class="gcard" href="game.html?g=${g.id}" style="--fam:${f.color}">
      <div class="thumb"><svg viewBox="0 0 320 200" role="img" aria-label="${esc(g.name)} illustration">${g.art(A)}</svg></div>
      <div class="body"><div class="fam">${f.label}${g.profile.complexity >= 4 ? '<span class="heavy-tag">Heavy</span>' : ''}</div><h3>${esc(g.name)}</h3><p>${md(g.pitch)}</p>
      <div class="stats"><span>${ICON_P}${rng(g.players)}</span><span>${ICON_T}${rng(g.time)} min</span><span class="dots" title="Rules weight">${[1,2,3,4,5].map(i => `<i class="${i <= Math.round(g.profile.complexity) ? 'on' : ''}"></i>`).join('')}</span></div></div></a>`;
  };

  function render() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const n = +np.value, t = +document.getElementById('tm').value, sort = document.getElementById('sort').value;
    let list = games.filter(g =>
      (!q || (g.name + ' ' + g.pitch + ' ' + g.mechanics.map(m => MECHANICS[m]).join(' ')).toLowerCase().includes(q)) &&
      (!n || (g.players[0] <= n && g.players[1] >= n)) &&
      (!t || g.time[0] <= t) &&
      (!activeFams.size || activeFams.has(g.family)));
    const out = document.getElementById('gallery');
    if (!list.length) { out.innerHTML = '<div class="empty">No games match those filters.</div>'; return; }
    if (sort === 'family') {
      out.innerHTML = Object.entries(FAMILIES).map(([k, f]) => {
        const gs = list.filter(g => g.family === k);
        return gs.length ? `<h3 style="margin:26px 0 4px;font-size:22px;display:flex;align-items:center;gap:10px"><i style="width:14px;height:14px;border-radius:50%;background:${f.color};border:1.5px solid #2a2420;display:inline-block"></i>${f.label}</h3><p class="small" style="margin:0 0 12px">${f.blurb}</p><div class="gallery">${gs.map(card).join('')}</div>` : '';
      }).join('');
    } else {
      list = list.slice().sort(sort === 'name' ? (a, b) => a.name.localeCompare(b.name) : (a, b) => a.profile.complexity - b.profile.complexity || a.time[0] - b.time[0]);
      out.innerHTML = `<div class="gallery">${list.map(card).join('')}</div>`;
    }
  }
  ['q', 'np', 'tm', 'sort'].forEach(id => document.getElementById(id).addEventListener('input', render));
  render();
});
</script>
</body>
</html>
